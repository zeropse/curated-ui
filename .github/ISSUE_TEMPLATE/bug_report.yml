name: 🐛 Bug Report
description: Report a bug, broken link, command error, or issue with a site, skill, or UI component.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Select where the bug or issue occurs.
      options:
        - Site Directory (/explore)
        - Skills Directory (/skills)
        - Broken Link or Invalid CLI Command
        - UI Components & Visual Layout
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. (e.g. Broken link for site X or incorrect CLI command for skill Y)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do we replicate the issue?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / Environment
      description: What browser and OS are you using?
